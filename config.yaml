# ==============================================================================
# HSC BORSA ANALİZ - YAPILANDIRMA DOSYASI
# ==============================================================================

# Izlenecek hisse senedi sembolleri (Yahoo Finance formatinda)
# BIST icin '.IS' ekleyin. ORNEK: THYAO.IS, GARAN.IS, AAPL, TSLA
symbols:
  - THYAO.IS
  - GARAN.IS
  - ASELS.IS
  - ISCTR.IS
  - SISE.IS

# Veri ayarlari
data:
  interval: 1d          # 1d, 1h, 1wk
  period: 2y            # 1y, 2y, 5y
  auto_adjust: true
  use_cache: true       # .cache klasorunde CSV olarak sakla

# Teknik gostergeler
indicators:
  sma_periods: [20, 50, 200]
  ema_fast: 12
  ema_slow: 26
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2.0
  stoch_k: 14
  stoch_d: 3
  atr_period: 14
  vwap_enabled: true

# Sinyal puan agirliklari (toplam -5 ile +5 arasinda normalize edilir)
signal_weights:
  rsi: 1.5
  macd: 1.5
  trend: 1.0
  bollinger: 1.0
  stochastic: 1.0
  obv: 0.5
  vwap: 0.5

# Sinyal esikleri
signal:
  strong_buy: 4.0
  buy: 2.0
  neutral: 0.0
  sell: -2.0
  strong_sell: -4.0

# Risk yonetimi
risk:
  initial_capital: 100000.0      # Baslangic sermayesi (TL/USD)
  position_size_pct: 0.10        # Her isleme sermaye %%10'u
  max_positions: 5               # Ayni anda acik en fazla pozisyon
  commission_pct: 0.0015         # Islem ucreti %%0.15
  slippage_pct: 0.0010           # Gercekci kayma (yurume) payi %%0.1 - backtestte giris/cikisa uygulanir
  spread_pct: 0.0010             # Alis-satis makasi %%0.1 - performans defterinde varsayim olarak
  journal_costs: true            # Performans defterinde maliyetleri dus (komisyon + spread + kayma)
  stop_loss_pct: 0.05            # %%5 zarar kesme
  take_profit_pct: 0.10          # %%10 kar al
  trailing_stop_pct: 0.03        # %%3 kayan stop (istegsiz bagli)

# Geriye donuk test (backtest)
backtest:
  execution: next_close          # next_close (gunun kapanisi ile ertesi gun kapanisi)

# Islem koruma kurallari (frekans / riskkit benzeri)
guards:
  cooldown_bars: 2               # Zararli islemden sonra kac bar beklenir
  stoploss_lookback: 20          # Son kac islem icinde stop sayimi
  stoploss_limit: 3              # Bu kadar stop sonrasi duraklat
  stoploss_pause_bars: 5         # Duraklama suresi (bar)
  daily_loss_cap_pct: 3.0        # Gunluk zarar limiti
  drawdown_tier1_pct: 3.0        # 1. kademe: pozisyonu yariya indir
  drawdown_tier2_pct: 5.0        # 2. kademe: pozisyonu %25'e indir
  drawdown_halt_pct: 8.0         # Bu seviyede islemi durdur
  min_spacing_bars: 2            # Ardarda islem icin minimum bar araligi

# Bildirimler
alerts:
  console: true
  save_json: true
  json_path: "results/signals.json"
  save_csv: true
  csv_path: "results/signals.csv"
  telegram_enabled: false
  telegram_bot_token: "BOT_TOKEN_BURAYA"
  telegram_chat_id: "CHAT_ID_BURAYA"
  ntfy_enabled: true             # Gerçek emir/karar bildirimleri açık
  ntfy_topic: "borsa-hsc-tr-2026" # ntfy.sh abonelik konusu (degistirilebilir)
  email_enabled: false           # Gmail SMTP (uygulama sifresi gerekir)

# GÜVENLİK — API anahtarında ÇEKME izni durumu (kullanıcı Binance TR API Yönetimi
# ekranından doğruladı: "Çekme İşlemlerinizi Etkinleştirin" kutucuğu BOŞ = kapalı).
# NOT: /open/v1/account/spot yanıtındaki canWithdraw HESAP durumudur, ANAHTAR izni değildir;
# Binance TR'de anahtar iznini okuyan endpoint yok (404). Bu yüzden doğrulama kaynağı budur.
security:
  withdraw_permission: false

# STRATEJI MODU — EMA50 Pullback (orijinal) / QUICK_PROFIT (SÜREKLİ KÜÇÜK KAR)
# Panelden degistirilir. EMA50 kodu silinmedi, yeni mod yanina eklendi.
strategy:
  mode: "QUICK_PROFIT"     # EMA50_PULLBACK | QUICK_PROFIT — panelden değiştirilebilir

# BINANCE - varsayilan TESTNET (sanal para). Gercek anahtar siz ekleyene kadar kapali.
binance:
  enabled: true             # yazilim tarafi acik; anahtar/env/onay kilitle bloklu kalir
  testnet: true             # ONCE testnet.binance.vision adresinden sanal API anahtari alin
  base_test: "https://testnet.binance.vision/api"
  base_live: "https://api.binance.com/api"
  allowed_symbols: ["BTC_TRY", "ETH_TRY"]
  max_order_usdt: 50
  confirmation_phrase: "HSC-BINANCE-ARM"

# BINANCE TR - global Binance'den AYRI borsa. Gercek anahtar dogrulandi.
# Emirler yine KILITLI: asagidaki kilitle birlikte ortam degiskeni de gerekir.
binance_tr:
  enabled: true
  allowed_symbols: ["BTC_USDT", "ETH_USDT"]
  max_order_usdt: 50        # tek emir ust siniri 50 TL (kasa 500 TL)
  max_order_try: 50         # ayni sinir, TRY cinsinden (okunur/tutar)
  confirmation_phrase: "HSC-BINANCE-TR-ARM"
  # Canli emir icin HSC_BINANCE_TR_LIVE=YES ve HSC_BINANCE_TR_ARMED=YES gerekir.

# GATE.IO - bu agda erisilebilen tek borsa. Varsayilan TESTNET (sanal para).
gateio:
  enabled: false
  testnet: true
  base_test: "https://api-testnet.gateapi.io/api/v4"
  base_live: "https://api.gateio.ws/api/v4"
  allowed_symbols: ["BTC_USDT", "ETH_USDT"]
  max_order_usdt: 50
  confirmation_phrase: "HSC-GATEIO-ARM"

# GERCEK PARA - VARSAIYLAN KAPALI. Acmak icin butun kilitlerin saglanmasi gerekir.
# Bu ayarlar tek basina emir acmaz; bkz. docs/GERCEK_PARA_YOL_HARITASI.md
live_trading:
  enabled: false                 # asla varsayilan acik birakma
  confirmation_phrase: "HSC-LIVE-ARM"  # arayuzde yazilmasi gereken ifade
  max_order_tl: 5000             # tek emir ust siniri
  max_daily_orders: 3            # gunluk emir sayisi siniri
  allowed_symbols: []            # bos = hicbir sembol izinli degil
  require_env_armed: true        # HSC_LIVE_ARMED ortam degiskeni sart

# Goruntuleme
visualize:
  save_charts: true
  chart_dir: "charts"
  show_plot: false
